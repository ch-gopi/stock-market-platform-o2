server:
  port: 8096
  address: 0.0.0.0

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://postgres:5432/usersdb   # Postgres service name
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true

#eureka:
