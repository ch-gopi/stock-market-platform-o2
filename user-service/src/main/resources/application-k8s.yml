#    register-with-eureka: true
#    fetch-registry: true
#  instance:
#    prefer-ip-address: false
#    hostname: user-service

jwt:
  secret: 2c1dXSuXoU0H4nQ9vN7gK2dZ9wL8fY6pJ1rV2bT6oP8=
  expiration: 8640000000   # 100 days (ms)
  refresh-expiration: 604800000 # 7 days refresh token

tracing:
  enabled: true
  sampling:
    probability: 1.0

zipkin:
  tracing:
    endpoint: http://zipkin:9411/api/v2/spans   # Zipkin service DNS name

observations:
  annotations:
    enabled: true

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 5MB
