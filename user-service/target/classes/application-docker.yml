server:
  port: 8096
  address: 0.0.0.0

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://postgres:5432/usersdb   # use service name instead of localhost
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true

eureka:
  client:
    transport:
      client: apache
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: user-service

jwt:
  secret: 2c1dXSuXoU0H4nQ9vN7gK2dZ9wL8fY6pJ1rV2bT6oP8=
  expiration: 8640000000
  refresh-expiration: 604800000

tracing:
  enabled: true
  sampling:
    probability: 1.0
zipkin:
  tracing:
    endpoint: http://zipkin:9411/api/v2/spans
observations:
  annotations:
    enabled: true

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 5MB
