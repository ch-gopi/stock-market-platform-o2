apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-search-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: market-search-service
  template:
    metadata:
      labels:
        app: market-search-service
    spec:
      containers:
      - name: market-search-service
        image: gopi/market-search-service:latest
        ports:
        - containerPort: 8090
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: k8
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 5
